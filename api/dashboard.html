<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRP ETL Dashboard - Live Data</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .metric-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .metric-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .metric-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .queries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .query-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .query-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .query-content {
            padding: 20px;
            max-height: 500px;
            overflow-y: auto;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 20px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        .data-table th {
            background: #f5f5f5;
            padding: 10px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }

        .data-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .data-table tr:hover {
            background: #f9f9f9;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-high {
            background: #d4edda;
            color: #155724;
        }

        .badge-medium {
            background: #fff3cd;
            color: #856404;
        }

        .badge-low {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }

        .footer {
            text-align: center;
            color: white;
            padding: 20px;
            margin-top: 40px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .queries-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 SRP ETL Dashboard</h1>
            <p>12 Intelligence Queries • Real-time Neo4j Data • 8 Core + 4 WOW Queries</p>
            <p style="margin-top: 15px;">
                <a href="/departments.html" style="color: white; text-decoration: underline; opacity: 0.9;">→ View Department-Specific Dashboards</a>
            </p>
        </div>

        <!-- Metrics Section -->
        <div class="metrics-grid" id="metrics-container">
            <div class="loading">Loading metrics...</div>
        </div>

        <!-- Queries Section -->
        <div class="queries-grid" id="queries-container">
            <div class="loading">Loading intelligence queries...</div>
        </div>

        <div class="footer">
            <p>🚀 SRP Prototype | ETL Dashboard | Real-time Data from Neo4j</p>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        // Fetch metrics
        async function loadMetrics() {
            try {
                const response = await fetch(`${API_URL}/metrics`);
                const metrics = await response.json();

                const container = document.getElementById('metrics-container');
                container.innerHTML = `
                    <div class="metric-card">
                        <div class="metric-label">Total Agents</div>
                        <div class="metric-value">${metrics.total_agents}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">High Confidence</div>
                        <div class="metric-value" style="color: #28a745;">${metrics.high_confidence}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Rising Stars</div>
                        <div class="metric-value" style="color: #ffc107;">${metrics.rising_stars}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Avg Rating</div>
                        <div class="metric-value" style="color: #17a2b8;">${metrics.avg_rating}/5</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Avg Confidence</div>
                        <div class="metric-value" style="color: #667eea;">${metrics.avg_confidence_score}%</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Needs Support</div>
                        <div class="metric-value" style="color: #dc3545;">${metrics.needs_support}</div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading metrics:', error);
                document.getElementById('metrics-container').innerHTML =
                    `<div class="error">Error loading metrics: ${error.message}</div>`;
            }
        }

        // Load individual queries
        async function loadQueries() {
            const queries = [
                {
                    id: 'movement-intelligence',
                    title: '🎯 Movement Intelligence',
                    endpoint: '/movement-intelligence',
                    columns: ['agent_name', 'company', 'vertical', 'city', 'state', 'movement_status', 'confidence']
                },
                {
                    id: 'relationship-discovery',
                    title: '🤝 Relationship Discovery',
                    endpoint: '/relationship-discovery',
                    columns: ['agent1', 'company1', 'agent2', 'company2', 'vertical', 'city', 'state']
                },
                {
                    id: 'vertical-intelligence',
                    title: '📈 Vertical Intelligence',
                    endpoint: '/vertical-intelligence',
                    columns: ['name', 'company', 'vertical_count', 'verticals', 'years_experience', 'confidence']
                },
                {
                    id: 'review-sentiment',
                    title: '⭐ Review Sentiment Leaders',
                    endpoint: '/review-sentiment',
                    columns: ['agent', 'city', 'state', 'avg_rating', 'review_count', 'company', 'trust_level']
                },
                {
                    id: 'location-concentration',
                    title: '🗺️ Location Concentration',
                    endpoint: '/location-concentration',
                    columns: ['city', 'state', 'vertical', 'agent_count', 'sample_agents']
                },
                {
                    id: 'tier-hierarchy',
                    title: '🏢 Tier Hierarchy Intelligence',
                    endpoint: '/tier-hierarchy',
                    columns: ['tier', 'priority', 'agent_count', 'avg_confidence', 'sample_cities']
                },
                {
                    id: 'credibility-leaders',
                    title: '✅ Credibility Leaders',
                    endpoint: '/credibility-leaders',
                    columns: ['agent', 'company', 'vertical', 'city', 'state', 'confidence_score', 'trust_level']
                },
                {
                    id: 'rising-stars',
                    title: '🌟 Rising Stars & Mentors',
                    endpoint: '/rising-stars',
                    columns: ['agent', 'company', 'trend', 'city', 'state', 'sales_readiness', 'influence']
                },
                {
                    id: 'wow-top-performers',
                    title: '🏆 WOW: Top Performers by Vertical',
                    endpoint: '/wow-top-performers',
                    columns: ['vertical', 'top_performers', 'market_strength']
                },
                {
                    id: 'wow-market-concentration',
                    title: '🔥 WOW: Market Concentration & Heat',
                    endpoint: '/wow-market-concentration',
                    columns: ['city', 'state', 'vertical', 'agent_count', 'market_heat']
                },
                {
                    id: 'wow-quality-network',
                    title: '💎 WOW: Quality Leaders Network',
                    endpoint: '/wow-quality-network',
                    columns: ['agent', 'rating', 'reviews', 'quality_peers', 'peer_avg_rating', 'network_strength']
                },
                {
                    id: 'wow-growth-opportunities',
                    title: '🚀 WOW: Growth Opportunities',
                    endpoint: '/wow-growth-opportunities',
                    columns: ['vertical', 'city', 'state', 'rising_talent_count', 'avg_win_probability', 'signal']
                }
            ];

            const container = document.getElementById('queries-container');
            container.innerHTML = '';

            for (const query of queries) {
                try {
                    const response = await fetch(`${API_URL}${query.endpoint}`);
                    const data = await response.json();

                    let tableHTML = `
                        <div class="query-card">
                            <div class="query-header">${query.title} (${data.length} results)</div>
                            <div class="query-content">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            ${query.columns.map(col => `<th>${formatHeader(col)}</th>`).join('')}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${data.slice(0, 10).map(row => `
                                            <tr>
                                                ${query.columns.map(col => `<td>${formatCell(row[col])}</td>`).join('')}
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                                <p style="text-align: center; color: #999; margin-top: 10px; font-size: 0.9em;">
                                    Showing 10 of ${data.length} results
                                </p>
                            </div>
                        </div>
                    `;

                    container.innerHTML += tableHTML;
                } catch (error) {
                    console.error(`Error loading ${query.id}:`, error);
                    container.innerHTML += `
                        <div class="query-card">
                            <div class="query-header">${query.title}</div>
                            <div class="query-content">
                                <div class="error">Error loading data: ${error.message}</div>
                            </div>
                        </div>
                    `;
                }
            }
        }

        // Formatting helpers
        function formatHeader(text) {
            return text
                .replace(/_/g, ' ')
                .split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        function formatCell(value) {
            if (value === null || value === undefined) {
                return '-';
            }

            if (Array.isArray(value)) {
                return value.join(', ');
            }

            if (typeof value === 'number') {
                if (value > 0 && value < 1) {
                    return (value * 100).toFixed(1) + '%';
                }
                return value.toFixed(2);
            }

            // Add badges for trust levels
            if (typeof value === 'string') {
                if (value.includes('high')) {
                    return `<span class="status-badge badge-high">${value}</span>`;
                } else if (value.includes('medium')) {
                    return `<span class="status-badge badge-medium">${value}</span>`;
                } else if (value.includes('low')) {
                    return `<span class="status-badge badge-low">${value}</span>`;
                }
            }

            return value;
        }

        // Load everything on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadMetrics();
            loadQueries();
        });
    </script>
</body>
</html>
